<div class="card border-0 shadow-sm">
  <div class="card-body">
    <h4 class="mb-4">Información personal</h4>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label"> Primer nombre </label>

        <input class="form-control" [(ngModel)]="form.primer_nombre" />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Segundo nombre </label>

        <input class="form-control" [(ngModel)]="form.segundo_nombre" />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Primer apellido </label>

        <input class="form-control" [(ngModel)]="form.primer_apellido" />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Segundo apellido </label>

        <input class="form-control" [(ngModel)]="form.segundo_apellido" />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Fecha de nacimiento </label>

        <input type="date" class="form-control" [(ngModel)]="form.fecha_nacimiento" />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Correo electrónico </label>

        <input type="email" class="form-control" [(ngModel)]="form.email" />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Nueva contraseña </label>

        <input type="password" class="form-control" [(ngModel)]="form.password" />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Confirmar contraseña </label>

        <input type="password" class="form-control" [(ngModel)]="form.confirmPassword" />
      </div>
    </div>

    <div class="mt-4 d-flex justify-content-end">
      <button class="btn btn-danger" (click)="save()" [disabled]="loading">
        @if (!loading) {
          Guardar y continuar
        }

        @if (loading) {
          Guardando...
        }
      </button>
    </div>
  </div>
</div>
