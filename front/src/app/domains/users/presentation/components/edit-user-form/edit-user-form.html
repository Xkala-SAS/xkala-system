<form (ngSubmit)="save()">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label"> Primer nombre </label>

      <input class="form-control" [(ngModel)]="form.primer_nombre" name="primer_nombre" />
    </div>

    <div class="col-md-6">
      <label class="form-label"> Segundo nombre </label>

      <input class="form-control" [(ngModel)]="form.segundo_nombre" name="segundo_nombre" />
    </div>

    <div class="col-md-6">
      <label class="form-label"> Primer apellido </label>

      <input class="form-control" [(ngModel)]="form.primer_apellido" name="primer_apellido" />
    </div>

    <div class="col-md-6">
      <label class="form-label"> Segundo apellido </label>

      <input class="form-control" [(ngModel)]="form.segundo_apellido" name="segundo_apellido" />
    </div>

    <div class="col-md-6">
      <label class="form-label"> Correo </label>

      <input type="email" class="form-control" [(ngModel)]="form.email" name="email" />
    </div>

    <div class="col-md-6">
      <label class="form-label"> Rol </label>

      <select class="form-select" [(ngModel)]="form.role_id" name="role_id">
        @for (role of roles; track role.id) {
          <option [value]="role.id">
            {{ role.nombre }}
          </option>
        }
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label"> Estado </label>

      <select class="form-select" [(ngModel)]="form.estado" name="estado">
        <option [ngValue]="true">Activo</option>

        <option [ngValue]="false">Inactivo</option>
      </select>
    </div>
  </div>

  <div class="mt-4 text-end">
    <button type="submit" class="btn btn-primary" [disabled]="loading">
      @if (loading) {
        Actualizando...
      } @else {
        Actualizar usuario
      }
    </button>
  </div>
</form>
