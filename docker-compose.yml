services:
  mysql:
    image: mysql:8
    container_name: xkala_mysql

    environment:
      MYSQL_DATABASE: xkala_system
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile

    container_name: xkala_backend

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./back:/app
      - uploads_data:/app/uploads

    env_file:
      - ./back/.env.prod

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      "

volumes:
  mysql_data:
  uploads_data:
