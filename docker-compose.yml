services:
  mysql:
    image: mysql:8.4.9

    container_name: xkala_mysql

    restart: always

    environment:
      MYSQL_DATABASE: xkala_system
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile

    container_name: xkala_backend

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - ./back/.env.prod

    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile

    container_name: xkala_frontend

    restart: always

    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx

    container_name: xkala_proxy

    restart: always

    depends_on:
      - frontend
      - backend

    ports:
      - "8080:80"

volumes:
  mysql_data:
  uploads_data:
