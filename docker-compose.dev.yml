services:
  mysql:
    image: mysql:8.4.9

    container_name: xkala_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xkala_system

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev

    container_name: xkala_backend

    restart: always

    depends_on:
        mysql:
          condition: service_started

    ports:
      - "8000:8000"

    volumes:
      - ./back:/app

    env_file:
      - ./back/.env.dev

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile.dev

    container_name: xkala_frontend

    working_dir: /app

    restart: always

    depends_on:
        backend:
          condition: service_healthy

    ports:
      - "4200:4200"

    volumes:
      - ./front:/app
      - frontend_node_modules:/app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  mysql_data:
  frontend_node_modules:
